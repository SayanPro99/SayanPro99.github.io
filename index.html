<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Galerie</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 0;
    }
    header {
      background: #111;
      color: #fff;
      padding: 1rem;
      text-align: center;
      font-size: 1.4rem;
      letter-spacing: 1px;
    }
    .category-buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
      background: #222;
      padding: 1rem;
    }
    .category-buttons button {
      background: #444;
      color: white;
      border: none;
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
      font-size: 1rem;
    }
    .category-buttons button:hover,
    .category-buttons button.active {
      background: #ff6b00;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      padding: 2rem;
    }
    .item {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.2s;
    }
    .item:hover {
      transform: scale(1.03);
    }
    .item img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }
    .info {
      padding: 0.8rem 1rem;
      text-align: center;
    }
    .price {
      font-weight: bold;
      color: #ff6b00;
    }
  </style>
</head>
<body>

  <header>🛍️ Mein Streetwear-Shop</header>

  <div class="category-buttons">
    <button id="tshirtBtn" class="active">T-Shirts</button>
    <button id="hoodieBtn">Hoodies</button>
    <button id="jackenBtn">Jacken</button>
  </div>

  <div id="gallery" class="gallery"></div>

    ];

    /* === Galerie generieren === */
    const gallery = document.getElementById("gallery");

    function loadCategory(category) {
      gallery.innerHTML = "";
      let basePath, images, price;

      if (category === "tshirt") {
        basePath = TSHIRT_BASE;
        images = tshirtImages;
        price = "CHF 60";
      } else if (category === "hoodie") {
        basePath = HOODIE_BASE;
        images = hoodieImages;
        price = "CHF 90";
      } else if (category === "jacken") {
        basePath = JACKEN_BASE;
        images = jackenImages;
        price = "CHF 120";
      }

      images.forEach(img => {
        const div = document.createElement("div");
        div.classList.add("item");
        div.innerHTML = `
          <img src="${basePath + img}" alt="">
          <div class="info">
            <p class="price">${price}</p>
          </div>
        `;
        gallery.appendChild(div);
      });
    }

    /* === Buttons === */
    const tshirtBtn = document.getElementById("tshirtBtn");
    const hoodieBtn = document.getElementById("hoodieBtn");
    const jackenBtn = document.getElementById("jackenBtn");

    function setActive(btn) {
      document.querySelectorAll(".category-buttons button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    }

    tshirtBtn.onclick = () => { setActive(tshirtBtn); loadCategory("tshirt"); };
    hoodieBtn.onclick = () => { setActive(hoodieBtn); loadCategory("hoodie"); };
    jackenBtn.onclick = () => { setActive(jackenBtn); loadCategory("jacken"); };

    /* === Startansicht === */
    loadCategory("tshirt");
  </script>

</body>
</html>
